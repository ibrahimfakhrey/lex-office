{% extends 'admin/base.html' %}
{% block title %}فاتورة جديدة{% endblock %}
{% block page_title %}إنشاء فاتورة يدوية{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('admin.billing_invoices') }}" class="text-decoration-none small text-muted">
        <i class="bi bi-arrow-right"></i> العودة لقائمة الفواتير
    </a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header"><i class="bi bi-receipt"></i> بيانات الفاتورة</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">المكتب *</label>
                            <select name="tenant_id" class="form-select" required>
                                <option value="">اختر المكتب</option>
                                {% for t in tenants %}
                                <option value="{{ t.id }}" {{ 'selected' if pre_tenant_id == t.id }}>{{ t.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">الخطة</label>
                            <select name="plan_id" class="form-select">
                                <option value="">— لا شيء —</option>
                                {% for p in plans %}
                                <option value="{{ p.id }}">{{ p.name_ar }} ({{ p.price_monthly }} ج.م/شهر)</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">المبلغ (ج.م) *</label>
                            <input type="number" step="0.01" name="amount" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">نوع الفاتورة</label>
                            <select name="payment_type" class="form-select">
                                <option value="monthly">شهري</option>
                                <option value="yearly">سنوي</option>
                                <option value="upgrade">ترقية</option>
                                <option value="custom" selected>مخصصة</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">طريقة الدفع</label>
                            <select name="payment_method" class="form-select">
                                <option value="manual">يدوي</option>
                                <option value="cash">كاش</option>
                                <option value="bank_transfer">تحويل بنكي</option>
                                <option value="card">بطاقة</option>
                                <option value="paymob">Paymob</option>
                                <option value="vodafone_cash">Vodafone Cash</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">الفترة من *</label>
                            <input type="date" name="period_start" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">الفترة إلى *</label>
                            <input type="date" name="period_end" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">تاريخ الاستحقاق</label>
                            <input type="date" name="due_date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">المرجع</label>
                            <input name="payment_reference" class="form-control" placeholder="رقم التحويل / رقم العملية">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">ملاحظات</label>
                            <textarea name="notes" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header"><i class="bi bi-gear"></i> الإعدادات</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">الحالة</label>
                        <select name="status" class="form-select">
                            <option value="pending" selected>قيد الدفع</option>
                            <option value="paid">مدفوعة</option>
                            <option value="unpaid">غير مدفوعة</option>
                        </select>
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check2"></i> إنشاء الفاتورة
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}
