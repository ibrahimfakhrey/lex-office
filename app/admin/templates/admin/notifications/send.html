{% extends 'admin/base.html' %}
{% block title %}إرسال إشعار{% endblock %}
{% block page_title %}إرسال إشعار لمكتب{% endblock %}

{% block content %}
<div class="row g-3">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header"><i class="bi bi-send"></i> رسالة فردية</div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">المكتب المستهدف *</label>
                        <select name="tenant_id" class="form-select" required>
                            <option value="">اختر المكتب</option>
                            {% for t in tenants %}
                            <option value="{{ t.id }}" {{ 'selected' if pre_tenant_id == t.id }}>{{ t.name }} {% if t.email %}({{ t.email }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">العنوان *</label>
                        <input name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">المحتوى *</label>
                        <textarea name="body" class="form-control" rows="5" required></textarea>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">الأولوية</label>
                            <select name="priority" class="form-select">
                                <option value="info">معلومة</option>
                                <option value="success">نجاح</option>
                                <option value="warning">تحذير</option>
                                <option value="urgent">عاجل</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">قنوات الإرسال</label>
                            <div class="d-flex gap-3 pt-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="channels" value="in_app" id="ch_inapp" checked>
                                    <label class="form-check-label small" for="ch_inapp">داخل التطبيق</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="channels" value="email" id="ch_email">
                                    <label class="form-check-label small" for="ch_email">بريد إلكتروني</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> إرسال الإشعار
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header"><i class="bi bi-megaphone"></i> رسالة جماعية</div>
            <div class="card-body">
                <p class="text-muted small">لإرسال إشعار جماعي لكل المكاتب أو فئة معينة</p>
                <a href="{{ url_for('admin.notifications_broadcast') }}" class="btn btn-outline-info w-100">
                    <i class="bi bi-broadcast"></i> رسالة جماعية
                </a>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-header"><i class="bi bi-clock-history"></i> السجل</div>
            <div class="card-body">
                <a href="{{ url_for('admin.notifications_history') }}" class="btn btn-outline-light w-100">
                    <i class="bi bi-list"></i> سجل الإشعارات الجماعية
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
