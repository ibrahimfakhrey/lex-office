{% extends "base_auth.html" %}
{% block title %}قبول الدعوة{% endblock %}

{% block content %}
<h4 class="text-center mb-4">مرحباً بك في {{ product_name }}</h4>
<p class="text-center text-muted small mb-4">تمت دعوتك للانضمام إلى <strong>{{ invitation.tenant.name }}</strong> بصفة <strong>{{ invitation.role.name_ar }}</strong></p>

<form method="POST" action="{{ url_for('auth.accept_invite', token=invitation.token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">البريد الإلكتروني</label>
        <input type="email" class="form-control" value="{{ invitation.email }}" disabled dir="ltr">
    </div>
    <div class="mb-3">
        <label for="full_name" class="form-label">الاسم الكامل</label>
        <input type="text" class="form-control" id="full_name" name="full_name" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">كلمة المرور</label>
        <input type="password" class="form-control" id="password" name="password" required dir="ltr">
        <div class="form-text">8 أحرف على الأقل، حرف كبير + رقم + رمز</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">إنشاء حسابي</button>
</form>
{% endblock %}
