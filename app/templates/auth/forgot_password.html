{% extends "base_auth.html" %}
{% block title %}نسيت كلمة المرور{% endblock %}

{% block content %}
<h4 class="text-center mb-4">استعادة كلمة المرور</h4>
<form method="POST" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="email" class="form-label">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="email" name="email" required placeholder="email@example.com" dir="ltr">
    </div>
    <button type="submit" class="btn btn-primary w-100">إرسال رمز التحقق</button>
</form>
{% endblock %}

{% block footer %}
<div class="text-center mt-3">
    <a href="{{ url_for('auth.login') }}" class="text-decoration-none small">العودة لتسجيل الدخول</a>
</div>
{% endblock %}
