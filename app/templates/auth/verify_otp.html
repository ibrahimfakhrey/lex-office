{% extends "base_auth.html" %}
{% block title %}التحقق من البريد{% endblock %}

{% block content %}
<h4 class="text-center mb-4">التحقق من البريد الإلكتروني</h4>
<p class="text-center text-muted small mb-4">أدخل رمز التحقق المرسل إلى بريدك الإلكتروني</p>

<form method="POST" action="{{ url_for('auth.verify_otp', user_id=user_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-4">
        <label for="otp" class="form-label">رمز التحقق</label>
        <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp"
               maxlength="6" required placeholder="000000" dir="ltr" autocomplete="one-time-code">
    </div>

    <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-check-circle me-1"></i> تحقق
    </button>
</form>
{% endblock %}
