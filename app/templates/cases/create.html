{% extends "base.html" %}
{% block title %}إضافة قضية - LexOffice{% endblock %}

{% block content %}
<div class="page-header">
    <h3>إضافة قضية جديدة</h3>
    <a href="{{ url_for('cases.index') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-right me-1"></i> العودة للقائمة
    </a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <!-- Case Identity -->
    <div class="card mb-3">
        <div class="card-header">بيانات القضية</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">الموكل <span class="text-danger">*</span></label>
                    <select name="client_id" class="form-select" required>
                        <option value="">-- اختر الموكل --</option>
                        {% for c in clients %}
                        <option value="{{ c.id }}" {% if form.get('client_id', pre_client_id|string if pre_client_id else '') == c.id|string %}selected{% endif %}>{{ c.full_name }} ({{ c.client_number or '' }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">نوع القضية <span class="text-danger">*</span></label>
                    <select name="case_type" class="form-select" required>
                        <option value="">-- اختر --</option>
                        {% for val, label in case_types %}
                        <option value="{{ val }}" {% if form.get('case_type') == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الأولوية</label>
                    <select name="priority" class="form-select">
                        {% for val, label in priorities %}
                        <option value="{{ val }}" {% if form.get('priority', 'normal') == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">رقم القضية</label>
                    <input type="text" name="case_number" class="form-control" dir="ltr" value="{{ form.get('case_number', '') }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">السنة القضائية</label>
                    <input type="text" name="judicial_year" class="form-control" dir="ltr" value="{{ form.get('judicial_year', '') }}" placeholder="2024">
                </div>
                <div class="col-md-3">
                    <label class="form-label">المحكمة</label>
                    <select name="court_id" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for court in courts %}
                        <option value="{{ court.id }}" {% if form.get('court_id') == court.id|string %}selected{% endif %}>{{ court.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">الدائرة</label>
                    <input type="text" name="circuit" class="form-control" value="{{ form.get('circuit', '') }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label">موضوع القضية</label>
                    <textarea name="subject" class="form-control" rows="2">{{ form.get('subject', '') }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Parties -->
    <div class="card mb-3">
        <div class="card-header">الأطراف</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">صفة الموكل</label>
                    <select name="our_client_capacity" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in capacities %}
                        <option value="{{ val }}" {% if form.get('our_client_capacity') == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">اسم الخصم</label>
                    <input type="text" name="opponent_name" class="form-control" value="{{ form.get('opponent_name', '') }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">صفة الخصم</label>
                    <input type="text" name="opponent_capacity" class="form-control" value="{{ form.get('opponent_capacity', '') }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">محامي الخصم</label>
                    <input type="text" name="opponent_lawyer" class="form-control" value="{{ form.get('opponent_lawyer', '') }}">
                </div>
            </div>
        </div>
    </div>

    <!-- Team -->
    <div class="card mb-3">
        <div class="card-header">فريق العمل</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">المحامي المسؤول <span class="text-danger">*</span></label>
                    <select name="responsible_lawyer_id" class="form-select" required>
                        <option value="">-- اختر --</option>
                        {% for l in lawyers %}
                        <option value="{{ l.id }}" {% if form.get('responsible_lawyer_id') == l.id|string %}selected{% endif %}>{{ l.full_name }} ({{ l.role.name_ar if l.role else '' }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">محامي مساعد</label>
                    <select name="assistant_lawyer_id" class="form-select">
                        <option value="">-- بدون --</option>
                        {% for l in lawyers %}
                        <option value="{{ l.id }}" {% if form.get('assistant_lawyer_id') == l.id|string %}selected{% endif %}>{{ l.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Fees -->
    <div class="card mb-3">
        <div class="card-header">الأتعاب</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">نوع الأتعاب</label>
                    <select name="fee_type" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in fee_types %}
                        <option value="{{ val }}" {% if form.get('fee_type') == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">مبلغ الأتعاب (ج.م)</label>
                    <input type="number" name="fee_amount" class="form-control" dir="ltr" step="0.01" value="{{ form.get('fee_amount', '') }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">المقدم المدفوع (ج.م)</label>
                    <input type="number" name="retainer_paid" class="form-control" dir="ltr" step="0.01" value="{{ form.get('retainer_paid', '0') }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">جدول السداد</label>
                    <select name="payment_schedule" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in payment_schedules %}
                        <option value="{{ val }}" {% if form.get('payment_schedule') == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Notes -->
    <div class="card mb-3">
        <div class="card-header">ملاحظات داخلية</div>
        <div class="card-body">
            <label class="form-label" for="internal_notes">ملاحظات داخلية</label>
            <textarea name="internal_notes" id="internal_notes" class="form-control" rows="3">{{ form.get('internal_notes', '') }}</textarea>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-circle me-1"></i> حفظ القضية
        </button>
        <a href="{{ url_for('cases.index') }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>
{% endblock %}
