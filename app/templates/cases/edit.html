{% extends "base.html" %}
{% block title %}تعديل قضية {{ case.case_number or '' }} - {{ product_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h3>تعديل القضية</h3>
    <a href="{{ url_for('cases.show', id=case.id) }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-right me-1"></i> العودة
    </a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <!-- Case Identity -->
    <div class="card mb-3">
        <div class="card-header">بيانات القضية</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">الموكل</label>
                    <input type="text" class="form-control" value="{{ case.client.full_name if case.client else '' }}" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label">نوع القضية</label>
                    <select name="case_type" class="form-select">
                        {% for val, label in case_types %}
                        <option value="{{ val }}" {% if case.case_type == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الحالة</label>
                    <select name="status" class="form-select">
                        {% for val, label in statuses %}
                        <option value="{{ val }}" {% if case.status == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">رقم القضية</label>
                    <input type="text" name="case_number" class="form-control" dir="ltr" value="{{ case.case_number or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">السنة القضائية</label>
                    <input type="text" name="judicial_year" class="form-control" dir="ltr" value="{{ case.judicial_year or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">المحكمة</label>
                    <select name="court_id" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for court in courts %}
                        <option value="{{ court.id }}" {% if case.court_id == court.id %}selected{% endif %}>{{ court.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">الدائرة</label>
                    <input type="text" name="circuit" class="form-control" value="{{ case.circuit or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">الأولوية</label>
                    <select name="priority" class="form-select">
                        {% for val, label in priorities %}
                        <option value="{{ val }}" {% if case.priority == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">موضوع القضية</label>
                    <textarea name="subject" class="form-control" rows="2">{{ case.subject or '' }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Parties -->
    <div class="card mb-3">
        <div class="card-header">الأطراف</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">صفة الموكل</label>
                    <select name="our_client_capacity" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in capacities %}
                        <option value="{{ val }}" {% if case.our_client_capacity == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">اسم الخصم</label>
                    <input type="text" name="opponent_name" class="form-control" value="{{ case.opponent_name or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">صفة الخصم</label>
                    <input type="text" name="opponent_capacity" class="form-control" value="{{ case.opponent_capacity or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">محامي الخصم</label>
                    <input type="text" name="opponent_lawyer" class="form-control" value="{{ case.opponent_lawyer or '' }}">
                </div>
            </div>
        </div>
    </div>

    <!-- Team -->
    <div class="card mb-3">
        <div class="card-header">فريق العمل</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">المحامي المسؤول</label>
                    <select name="responsible_lawyer_id" class="form-select">
                        {% for l in lawyers %}
                        <option value="{{ l.id }}" {% if case.responsible_lawyer_id == l.id %}selected{% endif %}>{{ l.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">محامي مساعد</label>
                    <select name="assistant_lawyer_id" class="form-select">
                        <option value="">-- بدون --</option>
                        {% for l in lawyers %}
                        <option value="{{ l.id }}" {% if case.assistant_lawyer_id == l.id %}selected{% endif %}>{{ l.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Fees -->
    <div class="card mb-3">
        <div class="card-header">الأتعاب</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">نوع الأتعاب</label>
                    <select name="fee_type" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in fee_types %}
                        <option value="{{ val }}" {% if case.fee_type == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">مبلغ الأتعاب (ج.م)</label>
                    <input type="number" name="fee_amount" class="form-control" dir="ltr" step="0.01" value="{{ case.fee_amount or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">المقدم المدفوع (ج.م)</label>
                    <input type="number" name="retainer_paid" class="form-control" dir="ltr" step="0.01" value="{{ case.retainer_paid or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">جدول السداد</label>
                    <select name="payment_schedule" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in payment_schedules %}
                        <option value="{{ val }}" {% if case.payment_schedule == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Notes -->
    <div class="card mb-3">
        <div class="card-header">ملاحظات داخلية</div>
        <div class="card-body">
            <textarea name="internal_notes" class="form-control" rows="3">{{ case.internal_notes or '' }}</textarea>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-circle me-1"></i> حفظ التعديلات
        </button>
        <a href="{{ url_for('cases.show', id=case.id) }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>
{% endblock %}
