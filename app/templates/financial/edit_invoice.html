{% extends "base.html" %}
{% block title %}تعديل الفاتورة - {{ product_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h3>تعديل الفاتورة {{ invoice.invoice_number or '' }}</h3>
    <a href="{{ url_for('financial.show_invoice', id=invoice.id) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-right me-1"></i> العودة</a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card mb-3">
        <div class="card-header">بيانات الفاتورة</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">الموكل <span class="text-danger">*</span></label>
                    <select name="client_id" class="form-select" required>
                        {% for cl in clients %}
                        <option value="{{ cl.id }}" {% if invoice.client_id == cl.id %}selected{% endif %}>{{ cl.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">القضية</label>
                    <select name="case_id" class="form-select">
                        <option value="">-- اختياري --</option>
                        {% for c in cases %}
                        <option value="{{ c.id }}" {% if invoice.case_id == c.id %}selected{% endif %}>{{ c.case_number or '-' }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الحالة</label>
                    <select name="status" class="form-select">
                        {% for val, label in invoice_statuses %}
                        <option value="{{ val }}" {% if invoice.status == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">تاريخ الإصدار <span class="text-danger">*</span></label>
                    <input type="date" name="issue_date" class="form-control" dir="ltr" value="{{ invoice.issue_date.strftime('%Y-%m-%d') if invoice.issue_date else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">نسبة الضريبة %</label>
                    <input type="number" name="tax_rate" class="form-control" dir="ltr" step="0.01" value="{{ invoice.tax_rate or '14' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">نوع الخصم</label>
                    <select name="discount_type" class="form-select">
                        <option value="">بدون خصم</option>
                        <option value="percentage" {% if invoice.discount_type == 'percentage' %}selected{% endif %}>نسبة %</option>
                        <option value="fixed" {% if invoice.discount_type == 'fixed' %}selected{% endif %}>مبلغ ثابت</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">قيمة الخصم</label>
                    <input type="number" name="discount_value" class="form-control" dir="ltr" step="0.01" value="{{ invoice.discount_value or '' }}">
                </div>
            </div>
        </div>
    </div>

    <!-- Line Items -->
    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>بنود الفاتورة</span>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addItem()"><i class="bi bi-plus me-1"></i> إضافة بند</button>
        </div>
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th style="width:40%">الوصف</th>
                        <th style="width:25%">النوع</th>
                        <th style="width:25%">المبلغ</th>
                        <th style="width:10%"></th>
                    </tr>
                </thead>
                <tbody id="itemsBody">
                    {% for item in items %}
                    <tr>
                        <td><input type="text" name="item_description[]" class="form-control form-control-sm" value="{{ item.description }}" required></td>
                        <td>
                            <select name="item_type[]" class="form-select form-select-sm">
                                {% for val, label in item_types %}
                                <option value="{{ val }}" {% if item.item_type == val %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td><input type="number" name="item_amount[]" class="form-control form-control-sm" dir="ltr" step="0.01" value="{{ item.amount }}" required></td>
                        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()"><i class="bi bi-x"></i></button></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <label class="form-label">ملاحظات</label>
            <textarea name="notes" class="form-control" rows="2">{{ invoice.notes or '' }}</textarea>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> حفظ التعديلات</button>
        <a href="{{ url_for('financial.show_invoice', id=invoice.id) }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>

<script>
function addItem() {
    const tbody = document.getElementById('itemsBody');
    const row = tbody.querySelector('tr').cloneNode(true);
    row.querySelectorAll('input').forEach(i => i.value = '');
    tbody.appendChild(row);
}
</script>
{% endblock %}
