<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ product_name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1849A9;
    --primary-dark: #0C2461;
    --accent: #078FD2;
    --bg: #F2F2F2;
    --surface: #FFFFFF;
    --text: #0C2461;
    --text-muted: #64748B;
    --border: rgba(12, 36, 97, 0.12);
    --danger: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }
  .top {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--accent) 100%);
    padding: 24px 20px;
    color: white;
  }
  .top-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .brand small {
    display: block;
    font-size: 12px;
    font-weight: 500;
    opacity: 0.85;
    margin-top: 2px;
    letter-spacing: 0;
  }
  .top a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    opacity: 0.9;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .top a:hover { opacity: 1; border-color: rgba(255,255,255,0.5); }
  main {
    max-width: 880px;
    margin: 30px auto;
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 36px 30px;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    color: var(--primary-dark);
    margin: 0 0 6px;
    letter-spacing: -0.4px;
  }
  .updated {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h2 {
    color: var(--primary);
    font-size: 18px;
    font-weight: 700;
    margin: 28px 0 10px;
  }
  h3 {
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    margin: 18px 0 8px;
  }
  p, li {
    font-size: 14.5px;
    color: var(--text);
  }
  ul {
    padding-right: 22px;
    margin: 8px 0;
  }
  li { margin-bottom: 6px; }
  a.link {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  a.link:hover { text-decoration: underline; }
  .btn {
    display: inline-block;
    padding: 10px 22px;
    background: var(--primary);
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #b91c1c; }
  .footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 24px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
    margin: 0 6px;
  }
  .alert {
    padding: 14px 16px;
    border-radius: 10px;
    margin: 16px 0;
    font-size: 14px;
    font-weight: 500;
  }
  .alert-warn {
    background: #FFF4DC;
    color: #7A5000;
    border: 1px solid #FFE093;
  }
  .alert-error {
    background: #FEF0F0;
    color: #9B2020;
    border: 1px solid #F0BCBC;
  }
  .alert-info {
    background: #EBF2FE;
    color: #0C447C;
    border: 1px solid #C5D8F5;
  }
  .alert-success {
    background: #EAF5F0;
    color: #0F7A55;
    border: 1px solid #B8E0CC;
  }
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-weight: 600;
    font-size: 13.5px;
    margin-bottom: 6px;
    color: var(--text);
  }
  input, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(7, 143, 210, 0.15);
  }
  textarea { resize: vertical; min-height: 90px; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">{% if product_logo %}<img src="{{ product_logo }}" alt="{{ product_name }}" style="height:28px;vertical-align:middle;margin-inline-end:0.4rem;">{% endif %}{{ product_name }}<small>إدارة المكاتب القانونية</small></div>
    <a href="/">العودة للموقع</a>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<div class="footer">
  © 2026 {{ product_name }}
  · <a href="/terms">الشروط والأحكام</a>
  · <a href="/privacy">سياسة الخصوصية</a>
  · <a href="/account/delete">حذف الحساب</a>
</div>
</body>
</html>
