{% extends "base.html" %}
{% block title %}إضافة جلسة - LexOffice{% endblock %}

{% block content %}
<div class="page-header">
    <h3>إضافة جلسة جديدة</h3>
    <a href="{{ url_for('sessions.index') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-right me-1"></i> العودة</a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card mb-3">
        <div class="card-header">بيانات الجلسة</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">القضية <span class="text-danger">*</span></label>
                    <select name="case_id" class="form-select" required>
                        <option value="">-- اختر القضية --</option>
                        {% for c in cases %}
                        <option value="{{ c.id }}" {% if form.get('case_id', pre_case_id|string if pre_case_id else '') == c.id|string %}selected{% endif %}>
                            {{ c.case_number or '-' }} - {{ c.client.full_name if c.client else '' }} - {{ c.subject[:30] if c.subject else '' }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">تاريخ الجلسة <span class="text-danger">*</span></label>
                    <input type="date" name="session_date" class="form-control" value="{{ form.get('session_date', '') }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">الوقت</label>
                    <input type="time" name="session_time" class="form-control" value="{{ form.get('session_time', '') }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">المحكمة</label>
                    <select name="court_id" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for court in courts %}
                        <option value="{{ court.id }}" {% if form.get('court_id') == court.id|string %}selected{% endif %}>{{ court.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الدائرة</label>
                    <input type="text" name="circuit" class="form-control" value="{{ form.get('circuit', '') }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">نوع الجلسة</label>
                    <select name="session_type" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in session_types %}
                        <option value="{{ val }}" {% if form.get('session_type') == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">المحامي المسؤول</label>
                    <select name="responsible_lawyer_id" class="form-select">
                        {% for l in lawyers %}
                        <option value="{{ l.id }}">{{ l.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">ملاحظات التحضير</label>
                    <textarea name="preparation_notes" class="form-control" rows="3">{{ form.get('preparation_notes', '') }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> حفظ الجلسة</button>
        <a href="{{ url_for('sessions.index') }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>
{% endblock %}
