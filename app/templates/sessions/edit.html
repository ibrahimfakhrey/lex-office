{% extends "base.html" %}
{% block title %}تعديل الجلسة - LexOffice{% endblock %}

{% block content %}
<div class="page-header">
    <h3>تعديل الجلسة</h3>
    <a href="{{ url_for('sessions.show', id=session.id) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-right me-1"></i> العودة</a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card mb-3">
        <div class="card-header">بيانات الجلسة</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">القضية</label>
                    <input type="text" class="form-control" value="{{ session.case.case_number or '' }} - {{ session.case.subject[:40] if session.case and session.case.subject else '' }}" disabled>
                </div>
                <div class="col-md-3">
                    <label class="form-label">تاريخ الجلسة <span class="text-danger">*</span></label>
                    <input type="date" name="session_date" class="form-control" value="{{ session.session_date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">الوقت</label>
                    <input type="time" name="session_time" class="form-control" value="{{ session.session_time.strftime('%H:%M') if session.session_time else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">المحكمة</label>
                    <select name="court_id" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for court in courts %}
                        <option value="{{ court.id }}" {% if session.court_id == court.id %}selected{% endif %}>{{ court.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الدائرة</label>
                    <input type="text" name="circuit" class="form-control" value="{{ session.circuit or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">نوع الجلسة</label>
                    <select name="session_type" class="form-select">
                        <option value="">-- اختر --</option>
                        {% for val, label in session_types %}
                        <option value="{{ val }}" {% if session.session_type == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">المحامي المسؤول</label>
                    <select name="responsible_lawyer_id" class="form-select">
                        {% for l in lawyers %}
                        <option value="{{ l.id }}" {% if session.responsible_lawyer_id == l.id %}selected{% endif %}>{{ l.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">ملاحظات التحضير</label>
                    <textarea name="preparation_notes" class="form-control" rows="3">{{ session.preparation_notes or '' }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> حفظ التعديلات</button>
        <a href="{{ url_for('sessions.show', id=session.id) }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>
{% endblock %}
