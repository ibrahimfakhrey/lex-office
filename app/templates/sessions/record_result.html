{% extends "base.html" %}
{% block title %}تسجيل نتيجة الجلسة - LexOffice{% endblock %}

{% block content %}
<div class="page-header">
    <h3>تسجيل نتيجة الجلسة</h3>
    <a href="{{ url_for('sessions.show', id=session.id) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-right me-1"></i> العودة</a>
</div>

<div class="card" style="max-width: 600px;">
    <div class="card-header">
        جلسة {{ session.session_date.strftime('%Y-%m-%d') }} - {{ session.case.case_number or '' }}
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">النتيجة <span class="text-danger">*</span></label>
                <select name="result" class="form-select" required>
                    <option value="">-- اختر --</option>
                    {% for val, label in session_results %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">ملخص النتيجة</label>
                <textarea name="result_summary" class="form-control" rows="3" placeholder="تفاصيل ما حدث في الجلسة..."></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">تاريخ الجلسة القادمة</label>
                <input type="date" name="next_session_date" class="form-control">
            </div>

            <div class="mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="create_next" value="yes" id="createNext" checked>
                    <label class="form-check-label" for="createNext">إنشاء الجلسة القادمة تلقائياً</label>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> حفظ النتيجة</button>
                <a href="{{ url_for('sessions.show', id=session.id) }}" class="btn btn-outline-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
