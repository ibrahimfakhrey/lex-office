{% extends "base.html" %}
{% block title %}مهمة جديدة - {{ product_name }}{% endblock %}
{% block page_title %}المهام والمواعيد{% endblock %}

{% block content %}
<div class="page-header">
    <h3>إنشاء مهمة جديدة</h3>
    <a href="{{ url_for('tasks.index') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-right me-1"></i> العودة</a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card mb-3">
        <div class="card-header">بيانات المهمة</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">عنوان المهمة <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" value="{{ form.get('title', '') }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الأولوية</label>
                    <select name="priority" class="form-select">
                        {% for val, label in priorities %}
                        <option value="{{ val }}" {% if form.get('priority', 'normal') == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">المكلّف <span class="text-danger">*</span></label>
                    <select name="assigned_to" class="form-select" required>
                        <option value="">-- اختر --</option>
                        {% for l in lawyers %}
                        <option value="{{ l.id }}">{{ l.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">الموكل</label>
                    <select id="taskClientPicker" class="form-select">
                        <option value="">— اختر الموكل —</option>
                        {% for cl in clients %}
                        <option value="{{ cl.id }}">{{ cl.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">القضية</label>
                    <select name="case_id" id="taskCasePicker" class="form-select">
                        <option value="">-- اختياري --</option>
                        {% if pre_case_id %}
                        {% for c in cases %}
                        {% if c.id == pre_case_id %}<option value="{{ c.id }}" selected>{{ c.case_number or '-' }} — {{ (c.subject or '')[:30] }}</option>{% endif %}
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الموعد النهائي</label>
                    <input type="datetime-local" name="deadline" class="form-control" dir="ltr" value="{{ form.get('deadline', '') }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">التذكير قبل الموعد بـ</label>
                    <select name="reminder_offset_days" class="form-select">
                        <option value="">— بدون —</option>
                        <option value="1" {% if form.get('reminder_offset_days') == '1' %}selected{% endif %}>يوم</option>
                        <option value="2" {% if form.get('reminder_offset_days') == '2' %}selected{% endif %}>يومين</option>
                        <option value="3" {% if form.get('reminder_offset_days') == '3' %}selected{% endif %}>3 أيام</option>
                        <option value="7" {% if form.get('reminder_offset_days') == '7' %}selected{% endif %}>أسبوع</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="3">{{ form.get('description', '') }}</textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> إنشاء المهمة</button>
        <a href="{{ url_for('tasks.index') }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>

{% block scripts %}
<script>
document.getElementById('taskClientPicker').addEventListener('change', async function () {
    const clientId = this.value;
    const casePicker = document.getElementById('taskCasePicker');
    casePicker.innerHTML = '<option value="">-- جارٍ التحميل... --</option>';

    if (!clientId) {
        casePicker.innerHTML = '<option value="">-- اختياري --</option>';
        return;
    }

    const res  = await fetch(`/cases/api/by-client/${clientId}`);
    const data = await res.json();

    casePicker.innerHTML = '<option value="">-- اختر القضية --</option>' +
        (data.length ? data.map(c => `<option value="${c.id}">${c.label}</option>`).join('') : '<option value="">لا توجد قضايا</option>');
});
</script>
{% endblock %}
{% endblock %}
