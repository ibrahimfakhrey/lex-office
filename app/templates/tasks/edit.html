{% extends "base.html" %}
{% block title %}تعديل المهمة - {{ product_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h3>تعديل المهمة</h3>
    <a href="{{ url_for('tasks.show', id=task.id) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-right me-1"></i> العودة</a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card mb-3">
        <div class="card-header">بيانات المهمة</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">عنوان المهمة <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الأولوية</label>
                    <select name="priority" class="form-select">
                        {% for val, label in priorities %}
                        <option value="{{ val }}" {% if task.priority == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">المكلّف <span class="text-danger">*</span></label>
                    <select name="assigned_to" class="form-select" required>
                        {% for l in lawyers %}
                        <option value="{{ l.id }}" {% if task.assigned_to == l.id %}selected{% endif %}>{{ l.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">القضية</label>
                    <select name="case_id" class="form-select">
                        <option value="">-- اختياري --</option>
                        {% for c in cases %}
                        <option value="{{ c.id }}" {% if task.case_id == c.id %}selected{% endif %}>{{ c.case_number or '-' }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">الموعد النهائي</label>
                    <input type="datetime-local" name="deadline" class="form-control" dir="ltr" value="{{ task.deadline.strftime('%Y-%m-%dT%H:%M') if task.deadline else '' }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="3">{{ task.description or '' }}</textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> حفظ التعديلات</button>
        <a href="{{ url_for('tasks.show', id=task.id) }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>
{% endblock %}
