{% extends "base.html" %}

{% block title %}استخدام القالب - {{ template.name_ar }}{% endblock %}
{% block page_title %}استخدام القالب - {{ template.name_ar }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <div class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i>
            اختر القضية و/أو الموكل لتعبئة المتغيرات تلقائياً في القالب.
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">القضية (اختياري)</label>
                <select name="case_id" class="form-select">
                    <option value="">-- بدون قضية --</option>
                    {% for case in cases %}
                    <option value="{{ case.id }}">{{ case.case_number }} - {{ case.subject }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">الموكل (اختياري)</label>
                <select name="client_id" class="form-select">
                    <option value="">-- بدون موكل --</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}">{{ client.full_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-file-earmark-text me-1"></i>إنشاء المستند
                </button>
                <a href="{{ url_for('templates_legal.show', id=template.id) }}" class="btn btn-outline-secondary">رجوع</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
